name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature!

  - type: dropdown
    id: service
    attributes:
      label: Service
      description: Which service would this feature affect?
      options:
        - personal-email-signup-backend
        - login-page-back
        - shared/common
        - infrastructure
      default: 0
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: |
        Currently, users cannot...
        This causes friction because...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution
      placeholder: |
        Add a new endpoint /api/auth/magic-link that...
        This would allow users to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other solutions have you considered?
      placeholder: |
        - Option A: Use SMS OTP (rejected due to cost)
        - Option B: Email verification links (current approach)

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High (blocking major use case)
        - Medium (valuable improvement)
        - Low (nice to have)
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context, mockups, or references
      placeholder: |
        Related documentation: https://...
        Similar implementation: https://...

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing feature requests to avoid duplicates
          required: true
        - label: This feature aligns with the project's goals
          required: true
