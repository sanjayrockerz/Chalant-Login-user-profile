name: Phase 0 quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - 'release-verification/**'

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-phase0.js

  signup-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/personal-email-signup-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/personal-email-signup-backend/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Install shared phone-normalization dependencies
        working-directory: packages/phone-normalization
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm test -- --runInBand

  identity-persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase1_ci_only
          POSTGRES_DB: phase1_identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase1_identity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/personal-email-signup-backend
    env:
      PHASE1_DATABASE_PROVENANCE: ci-service
      PGPASSWORD: phase1_ci_only
      REDIS_URL: redis://127.0.0.1:6379
      USE_REAL_REDIS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/personal-email-signup-backend/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Install shared phone-normalization dependencies
        working-directory: packages/phone-normalization
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Redis service
        run: node -e "const Redis=require('ioredis'); const r=new Redis(process.env.REDIS_URL); r.ping().then(v=>{console.log(v); return r.quit()}).catch(e=>{console.error(e); process.exit(1)})"
      - run: npx prisma generate --schema=prisma/auth.schema.prisma
      - run: npm run migration:governance:check
      - run: createdb -h 127.0.0.1 -U postgres phase1_fresh
      - run: createdb -h 127.0.0.1 -U postgres phase1_upgrade
      - run: export PHASE1_DATABASE_URL='postgresql://postgres:phase1_ci_only@127.0.0.1:5432/phase1_fresh'; export DATABASE_URL_AUTH="$PHASE1_DATABASE_URL"; npm run migration:fresh:init
      - name: Run all real PostgreSQL and Redis integration suites
        run: >-
          export PHASE1_DATABASE_URL='postgresql://postgres:phase1_ci_only@127.0.0.1:5432/phase1_fresh';
          export PHASE2A_DATABASE_URL="$PHASE1_DATABASE_URL";
          export PHASE2B_DATABASE_URL="$PHASE1_DATABASE_URL";
          export PHASE2C_DATABASE_URL="$PHASE1_DATABASE_URL";
          export PHASE3_DATABASE_URL="$PHASE1_DATABASE_URL";
          export PHASE4_DATABASE_URL="$PHASE1_DATABASE_URL";
          export DATABASE_URL_AUTH="$PHASE1_DATABASE_URL";
          export DATABASE_URL="$PHASE1_DATABASE_URL";
          export REDIS_URL='redis://127.0.0.1:6379';
          export CONTACT_HASH_MODE='hmac-sha256-v2';
          export CONTACT_HMAC_KEY='ci-only-contact-hmac-key-at-least-32-bytes';
          export ACTIVE_POLICY_VERSION='v-test-1';
          npm run test:integration:real -- --silent
      - run: export DATABASE_URL_AUTH='postgresql://postgres:phase1_ci_only@127.0.0.1:5432/phase1_fresh'; export REDIS_URL='redis://127.0.0.1:6379'; export CANONICAL_RECOVERY_ENABLED='true'; npm run test -- src/canonical-auth/canonical-recovery.service.spec.ts --runInBand --silent
      - run: export PHASE1_DATABASE_URL='postgresql://postgres:phase1_ci_only@127.0.0.1:5432/phase1_upgrade'; export DATABASE_URL_AUTH="$PHASE1_DATABASE_URL"; psql "$PHASE1_DATABASE_URL" -v ON_ERROR_STOP=1 -f ../../scripts/phase1-identity-test-baseline.sql; psql "$PHASE1_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20261009120000_identity_foundation/migration.sql; psql "$PHASE1_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20261010100000_canonical_onboarding_state/migration.sql; psql "$PHASE1_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20261010120000_canonical_policy_acceptance/migration.sql; npm run migration:upgrade:verify; npm run test:identity:persistence -- --silent

  phone-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phone-normalization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/phone-normalization/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
