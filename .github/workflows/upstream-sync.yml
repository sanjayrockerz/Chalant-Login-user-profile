name: Upstream Sync Monitoring

on:
  schedule:
    # Check for upstream changes every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync even without upstream changes'
        required: false
        default: false
        type: boolean
      skip_tests:
        description: 'Skip test validation (emergency sync)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-upstream-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      login_changes: ${{ steps.check.outputs.login_changes }}
      signup_changes: ${{ steps.check.outputs.signup_changes }}
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "upstream-sync-bot"
          git config user.email "platform@company.com"

      - name: Add upstream remotes
        run: |
          git remote add upstream-login https://github.com/jaidevms/login-page-back.git || true
          git remote add upstream-signup https://github.com/Harishraghave-07/personal-email-signup-backend.git || true

      - name: Check for upstream changes
        id: check
        run: |
          # Fetch upstream
          git fetch upstream-login main
          git fetch upstream-signup main
          
          # Count new commits
          login_changes=$(git rev-list --count HEAD..upstream-login/main 2>/dev/null || echo "0")
          signup_changes=$(git rev-list --count HEAD..upstream-signup/main 2>/dev/null || echo "0")
          
          echo "login_changes=${login_changes}" >> $GITHUB_OUTPUT
          echo "signup_changes=${signup_changes}" >> $GITHUB_OUTPUT
          
          total_changes=$((login_changes + signup_changes))
          if [ "$total_changes" -gt "0" ] || [ "${{ github.event.inputs.force_sync }}" = "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Found ${total_changes} upstream changes (login: ${login_changes}, signup: ${signup_changes})"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No upstream changes detected"
          fi

      - name: Create sync issue if changes detected
        if: steps.check.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const loginChanges = '${{ steps.check.outputs.login_changes }}';
            const signupChanges = '${{ steps.check.outputs.signup_changes }}';
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream Sync Required - ${date}`,
              body: `## Upstream Changes Detected

**Date**: ${date}
**Login Service Changes**: ${loginChanges} commits
**Signup Service Changes**: ${signupChanges} commits

### Actions Required:
- [ ] Review upstream changes
- [ ] Execute sync using: \`./scripts/sync-upstream.sh\`
- [ ] Validate changes in sync branch
- [ ] Create PR for review
- [ ] Monitor post-merge for issues

### Useful Commands:
\`\`\`bash
# Preview changes
./scripts/sync-upstream.sh --dry-run

# Execute sync
./scripts/sync-upstream.sh

# Emergency sync (skip tests)
./scripts/sync-upstream.sh --skip-tests
\`\`\`

### Assignees:
- @platform-team
- @jaidevms (login service owner)
- @Harishraghave-07 (signup service owner)

**Auto-generated by upstream sync monitoring workflow**`,
              labels: ['sync-required', 'upstream', 'maintenance']
            });
            
            core.info(`Created sync issue: ${issue.data.html_url}`);

  automated-sync:
    runs-on: ubuntu-latest
    needs: check-upstream-changes
    if: needs.check-upstream-changes.outputs.has_changes == 'true'
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd services/login-page-back && npm ci
          cd ../personal-email-signup-backend && npm ci

      - name: Configure git
        run: |
          git config user.name "upstream-sync-bot"
          git config user.email "platform@company.com"

      - name: Add upstream remotes
        run: |
          git remote add upstream-login https://github.com/jaidevms/login-page-back.git || true
          git remote add upstream-signup https://github.com/Harishraghave-07/personal-email-signup-backend.git || true

      - name: Execute automated sync
        id: sync
        run: |
          # Set environment for sync script
          export SYNC_DATE=$(date +%Y-%m-%d)
          export AUTOMATED_SYNC=true
          
          # Execute sync with appropriate flags
          if [ "${{ github.event.inputs.skip_tests }}" = "true" ]; then
            ./scripts/sync-upstream.sh --skip-tests
          else
            ./scripts/sync-upstream.sh
          fi

      - name: Run validation tests
        if: github.event.inputs.skip_tests != 'true'
        run: |
          # Run comprehensive test suite
          npm run type-check
          npm run lint
          npm test
          
          # Service-specific tests
          cd services/login-page-back && npm test
          cd ../personal-email-signup-backend && npm test

      - name: Create sync PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const branchName = `sync/upstream-changes-${date}`;
            
            // Check if sync branch exists
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branchName}`
              });
              
              // Create PR for the sync branch
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Automated Upstream Sync - ${date}`,
                head: branchName,
                base: 'main',
                body: `## Automated Upstream Sync

**Sync Date**: ${date}
**Login Service Changes**: ${{ needs.check-upstream-changes.outputs.login_changes }} commits
**Signup Service Changes**: ${{ needs.check-upstream-changes.outputs.signup_changes }} commits

### Changes Included:
- Upstream changes merged via git subtree
- All tests passing
- Monorepo customizations preserved

### Validation Results:
- ✅ TypeScript compilation
- ✅ Linting checks
- ✅ Unit tests
- ✅ Integration tests
- ✅ Service-specific tests

### Review Checklist:
- [ ] Review upstream changes for breaking changes
- [ ] Verify monorepo customizations preserved
- [ ] Check for any new configuration requirements
- [ ] Validate observability instrumentation intact
- [ ] Confirm no regression in critical flows

**Auto-generated by upstream sync workflow**`,
                labels: ['sync', 'automated', 'upstream']
              });
              
              core.info(`Created sync PR: ${pr.data.html_url}`);
              
              // Request reviews from relevant teams
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.data.number,
                reviewers: ['platform-team'],
                team_reviewers: ['backend-team']
              });
              
            } catch (error) {
              core.setFailed(`Failed to create PR: ${error.message}`);
            }

      - name: Comment on sync issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            // Find today's sync issue
            const date = new Date().toISOString().split('T')[0];
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'sync-required',
              state: 'open',
              sort: 'created',
              direction: 'desc'
            });
            
            const syncIssue = issues.data.find(issue => 
              issue.title.includes(date)
            );
            
            if (syncIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: syncIssue.number,
                body: `✅ **Automated sync completed successfully!**

🔗 **Sync PR**: Created and ready for review
📊 **Tests**: All validation tests passed
⏱️ **Duration**: Completed in ${{ job.duration || 'unknown' }} minutes

**Next Steps:**
1. Review the sync PR
2. Approve and merge if changes look good
3. Monitor services post-merge
4. Close this issue

*Automated sync workflow completed at ${new Date().toISOString()}*`
              });
              
              // Add success label
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: syncIssue.number,
                labels: ['automated-sync-success']
              });
            }

  notify-failure:
    runs-on: ubuntu-latest
    needs: [check-upstream-changes, automated-sync]
    if: failure() && needs.check-upstream-changes.outputs.has_changes == 'true'
    steps:
      - name: Notify sync failure
        uses: actions/github-script@v7
        with:
          script: |
            // Find today's sync issue and update it
            const date = new Date().toISOString().split('T')[0];
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'sync-required',
              state: 'open',
              sort: 'created',
              direction: 'desc'
            });
            
            const syncIssue = issues.data.find(issue => 
              issue.title.includes(date)
            );
            
            if (syncIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: syncIssue.number,
                body: `❌ **Automated sync failed!**

🚨 **Manual intervention required**
📋 **Workflow**: [View failed run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

**Possible Issues:**
- Merge conflicts requiring manual resolution
- Test failures after sync
- Network connectivity issues
- Upstream repository access problems

**Manual Sync Steps:**
\`\`\`bash
# Check the sync script dry-run first
./scripts/sync-upstream.sh --dry-run

# Manual sync if needed
./scripts/sync-upstream.sh
\`\`\`

**Escalation:**
- 🔧 Platform team: @platform-team
- 🚨 Security team: @security-team (if security updates)
- 📞 On-call: Check internal escalation procedures

*Automated sync failure detected at ${new Date().toISOString()}*`
              });
              
              // Add failure labels and increase priority
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: syncIssue.number,
                labels: ['automated-sync-failed', 'high-priority', 'needs-manual-intervention']
              });
            }

            // Create urgent notification issue if sync failure is critical
            if ('${{ needs.check-upstream-changes.outputs.login_changes }}' > 0 || 
                '${{ needs.check-upstream-changes.outputs.signup_changes }}' > 0) {
              
              const urgentIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 URGENT: Automated Sync Failed - Manual Intervention Required`,
                body: `## Critical Sync Failure

**Date**: ${date}
**Workflow**: [Failed Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

**Impact**: Upstream changes are not synced, services may be running outdated code

**Required Actions:**
1. 🔍 Investigate failure cause
2. 🛠️ Execute manual sync
3. ✅ Validate all services
4. 📊 Update monitoring

**Assignees**: @platform-team, @security-team

**Priority**: HIGH - resolve within 4 hours`,
                labels: ['critical', 'sync-failure', 'urgent', 'platform-team']
              });
              
              core.warning(`Created urgent sync failure issue: ${urgentIssue.data.html_url}`);
            }