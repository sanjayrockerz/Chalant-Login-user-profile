name: Services CI

on:
  push:
    paths:
      - 'services/**'
      - '.github/workflows/services-ci.yml'
  pull_request:
    paths:
      - 'services/**'
      - '.github/workflows/services-ci.yml'

jobs:
  login-page-back:
    name: Login Page Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/login-page-back
    permissions: write-all
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate login service contract
        run: |
          if [[ -f package.json ]]; then
            npm ci
            npm run lint --if-present
            npm run build --if-present
            npm test --if-present
          else
            echo 'Login page backend is specification-only; executable checks are deferred until package.json is added.'
          fi
        env:
          HUSKY: '0'
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-test-results
          path: services/login-page-back/test-results || services/login-page-back/coverage || ''

  personal-email-signup-backend:
    name: Personal Email Signup Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/personal-email-signup-backend
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: services/personal-email-signup-backend/package-lock.json
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            services/personal-email-signup-backend/node_modules
            services/personal-email-signup-backend/.npm
          key: personal-email-signup-backend-${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('services/personal-email-signup-backend/package-lock.json') }}
          restore-keys: |
            personal-email-signup-backend-${{ runner.os }}-node-${{ matrix.node-version }}-
      - name: Install shared phone-normalization dependencies
        working-directory: packages/phone-normalization
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build shared phone-normalization package
        working-directory: packages/phone-normalization
        run: npm run build
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: npm test --if-present
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signup-test-results
          path: services/personal-email-signup-backend/test-results || services/personal-email-signup-backend/coverage || ''

  deploy-login:
    name: Deploy Login Page Backend
    runs-on: ubuntu-latest
    needs: login-page-back
    if: contains(github.event.head_commit.message, 'deploy:login') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Trigger deploy for login
        run: echo "Deploy steps for login-page-back would run here"

  deploy-signup:
    name: Deploy Signup Backend
    runs-on: ubuntu-latest
    needs: personal-email-signup-backend
    if: contains(github.event.head_commit.message, 'deploy:signup') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Trigger deploy for signup
        run: echo "Deploy steps for personal-email-signup-backend would run here"
