apiVersion: 1

datasources:
  # Prometheus - Metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    uid: prometheus
    editable: true
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: "View trace"

  # Loki - Logs  
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        # Link trace_id in logs to Tempo
        - name: "trace_id"
          matcherRegex: '"trace_id":"([^"]*)"'
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: "View trace"
        # Link correlation_id for request tracing
        - name: "correlation_id"
          matcherRegex: '"correlation_id":"([^"]*)"'
          url: ""
          internal:
            query: '{correlation_id="${__value.raw}"}'
            datasourceUid: loki
          urlDisplayLabel: "Show related logs"

  # Tempo - Distributed Tracing
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    editable: true
    jsonData:
      httpMethod: GET
      tracesToLogs:
        datasourceUid: loki
        tags: ['correlation_id', 'tenant_id']
        mappedTags:
          - key: service.name
            value: service
        mapTagNamesEnabled: true
        spanStartTimeShift: '1h'
        spanEndTimeShift: '1h'
        filterByTraceID: false
        filterBySpanID: false
        lokiSearch: true
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: service
          - key: correlation_id
        queries:
          - name: 'Request Rate'
            query: 'rate(http_requests_total{service="$${__field.labels.service}"}[5m])'
          - name: 'Request Duration'
            query: 'histogram_quantile(0.9, rate(http_request_duration_seconds_bucket{service="$${__field.labels.service}"}[5m]))'
      serviceMap:
        datasourceUid: prometheus
      search:
        hide: false
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki